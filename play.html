<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twisted Metal Web</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 13px/1.4 system-ui, sans-serif; color: #eee; }
      #game canvas { display: block; }
      #hud { position: fixed; top: 8px; left: 8px; background: #000a; padding: 6px 10px; border-radius: 6px; min-width: 320px; }
      #hud .bars { display: flex; gap: 8px; margin-bottom: 4px; }
      #hud .bar { position: relative; flex: 1; height: 16px; background: #333; border-radius: 3px; overflow: hidden; }
      #hud .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
      #hud .bar.hp i { background: linear-gradient(90deg, #c22, #4c4); }
      #hud .bar.turbo i { background: #29f; }
      #hud .bar b { position: relative; font-size: 11px; padding-left: 4px; }
      #hud .sel { color: #ff4; font-weight: bold; text-decoration: underline; }
      #hud .small { font-size: 11px; opacity: .8; }
      #hud .toast { color: #ffd34d; font-weight: bold; }
      #hud .dead { color: #f55; font-size: 20px; font-weight: bold; }
      #help { position: fixed; bottom: 8px; left: 8px; background: #000a; padding: 4px 8px; border-radius: 4px; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; background: #111; }
      #loading[hidden], #menu[hidden], #hud[hidden], #help[hidden] { display: none; }
      #menu { position: fixed; inset: 0; overflow: auto; padding: 12px 16px; box-sizing: border-box; background: #000; }
      #menu-bg { position: fixed; inset: 0; z-index: 0; }
      #menu-bg canvas { display: block; }
      #menu .menu-shade { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 45%, #0004, #0009 80%); pointer-events: none; }
      #menu header, #menu .cols { position: relative; z-index: 1; }
      #menu header { text-align: center; margin-bottom: 8px; }
      #menu .logo { max-width: min(560px, 90vw); height: auto; filter: drop-shadow(0 4px 10px #000); }
      #menu .title { margin: 10px 0 6px; }
      #menu .title canvas { display: block; }
      #menu .cols { display: grid; grid-template-columns: 1fr minmax(300px, 1.1fr) 1fr; gap: 16px; align-items: start; }
      #menu .cars .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 4px; }
      #menu .levels .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
      #menu button { font: inherit; color: #eee; background: #0008; border: 1px solid #2a4; border-radius: 4px; padding: 2px; cursor: pointer; }
      #menu button img { display: block; width: 100%; height: auto; image-rendering: auto; }
      #menu .levels button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; }
      #menu .levels button img { width: 96px; }
      #menu button:hover { border-color: #9f6; box-shadow: 0 0 8px #3f3a; }
      #menu button.on { background: #1d4a12cc; border-color: #ddd80a; box-shadow: 0 0 12px #dd0a; }
      #menu .preview { position: sticky; top: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
      #preview { width: 100%; height: 260px; border-radius: 8px; background: radial-gradient(circle at 50% 60%, #2a3a2a, #0000 75%); }
      #menu .carname { min-height: 30px; }
      #menu .card { width: min(100%, 384px); height: auto; border: 1px solid #2a4; border-radius: 4px; }
      #menu .card[hidden] { display: none; }
      #menu .bio { margin: 0; max-height: 7.5em; overflow: auto; font-size: 12px; line-height: 1.5; color: #cfc; text-shadow: 0 1px 2px #000; }
      #menu .bots { display: flex; gap: 8px; align-items: center; justify-content: center; }
      #menu .diff { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
      #menu .diff button { padding: 4px 6px; }
      #menu button.start { padding: 10px 28px; background: #ddd80a; border: 0; box-shadow: 0 0 14px #dd08; }
      #menu button.start:hover { background: #f4ef3a; }
      #menu .keys { margin: 0; text-align: center; font-size: 11px; opacity: .7; }
      @media (max-width: 900px) {
        #menu .cols { grid-template-columns: 1fr; }
        #menu .preview { position: static; order: -1; }
        #preview { height: 200px; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="help">W/↑ acelerar · S/↓ freio/ré · A/D virar · Espaço freio de mão · <b>J</b> metralhadora · <b>K</b> arma especial · <b>L</b> trocar arma · <b>Shift</b> turbo · R renascer · C câmera · M som · Esc menu · gamepad: RT/LT, RB tiro, B especial, Y troca, LB turbo</div>
    <div id="loading">carregando…</div>
    <div id="menu" hidden></div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
